name: Update Rules

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC (after ipnova + domainnova weekly runs)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if a region lost >50% of its entries (yes/no)"
        required: false
        default: "no"

# Never let two builds race on the same branch (manual + scheduled).
concurrency:
  group: rulenova-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2   # enough to inspect and amend the last commit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python3 sources/scripts/test_offline.py

      - name: Build rule sets
        run: |
          ARGS="--repo-root ."
          if [ "${{ github.event.inputs.allow_shrink }}" = "yes" ]; then
            ARGS="$ARGS --allow-shrink"
          fi
          python3 sources/scripts/build_rules.py $ARGS

      - name: Validate output
        run: python3 sources/scripts/validate_output.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          PREFIX="chore(output): rulenova"
          git config user.name  "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # output/ uses a single-commit strategy: the bot's previous output
          # commit is amended instead of stacking a new one each week.
          #
          # v2.1 recognised "its" commit only by the message prefix
          # "sync: rulenova" — the same prefix the maintainer's local sync
          # script uses for *code* commits — so code commits were amended and
          # force-pushed too. Now the last commit is amended only if ALL hold:
          #   - message starts with the bot-only prefix above
          #   - authored by github-actions[bot]
          #   - it changes nothing outside output/
          LAST_MSG=$(git log -1 --pretty=%s)
          LAST_AUTHOR=$(git log -1 --pretty=%an)
          NON_OUTPUT=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v '^output/' || true)
          if [[ "$LAST_MSG" == "$PREFIX"* && "$LAST_AUTHOR" == "$BOT_NAME" && -z "$NON_OUTPUT" ]]; then
            echo "Amending previous bot output commit"
            git commit --amend -m "$PREFIX $(date -u '+%Y-%m-%d %H:%M')" --date="$(date -u -R)"
            git push --force-with-lease
          else
            echo "Creating new output commit"
            git commit -m "$PREFIX $(date -u '+%Y-%m-%d %H:%M')"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "::warning::push rejected (attempt $attempt), rebasing"
              git pull --rebase --autostash
              sleep $((attempt * 5))
            done
            echo "::error::failed to push after 3 attempts"
            exit 1
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: update
    if: ${{ failure() }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `RuleNova update failed — ${new Date().toISOString().split('T')[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## RuleNova automated update failed',
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              'Possible causes:',
              '- ipnova / domainnova data unavailable, or a region collapsed by more than 50%',
              '  (the build refuses to publish; the last good rules stay online)',
              '- Output validation failed',
              '- Git push conflict',
              '',
              'If a large drop is intended, re-run manually with allow_shrink = yes.',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another failed run: ${runUrl}`,
              });
            }
